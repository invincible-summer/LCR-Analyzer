name: Deploy LCR site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docs/show/html-to-ppt/**"
      - ".github/workflows/pages-show.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build static frontend
        working-directory: frontend
        env:
          LCR_PUBLIC_BASE: /LCR-Analyzer/
          VITE_STATIC_DEPLOY: "1"
          VITE_THEORY_URL: /LCR-Analyzer/show/
        run: pnpm build

      - name: Prepare Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/show

          # Vue/WASM 应用构建为站点主页（/）。
          cp -a frontend/dist/. _site/

          # 展示幻灯发布在 /show/，slides.html 同时作为该路径的索引页。
          cp -a docs/show/html-to-ppt/. _site/show/
          cp _site/show/slides.html _site/show/index.html
          find _site/show -maxdepth 1 -name '~$*' -delete

          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
